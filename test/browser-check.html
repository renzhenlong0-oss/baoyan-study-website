  <script>
    /* 自动巡检：捕获错误 → 点击封面进入 → 逐个切换 Tab → 记录可见性 */
    window.__errors = [];
    window.addEventListener('error', function (e) { window.__errors.push(String(e.message)); });

    function writeResult(text) {
      var pre = document.getElementById('test-output') || document.createElement('pre');
      pre.id = 'test-output';
      pre.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;background:#fff;padding:8px;font-size:11px;max-height:60vh;overflow:auto;border:1px solid #000;';
      pre.textContent = text;
      if (!pre.parentNode) document.body.appendChild(pre);
    }

    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        try {
          var out = [];
          var all = ['home', 'today', 'weekplan', 'courses', 'programming', 'research', 'english', 'competition', 'resources', 'review'];

          /* 点击封面进入（与用户操作一致） */
          var cover = document.querySelector('#cover-root .cover');
          if (cover && typeof cover.click === 'function') cover.click();
          out.push('cover-clicked: ' + !!cover);

          /* 等封面动画结束后逐个切换 */
          setTimeout(function () {
            try {
              var stopTab = new URLSearchParams(location.search).get('stop');
              var tour = ['today', 'weekplan', 'courses', 'programming', 'research', 'english', 'competition', 'resources', 'review', 'home'];
              tour.forEach(function (t) {
                switchTab(t);
                var visible = all.filter(function (v) {
                  var el = document.getElementById('view-' + v);
                  return el && !el.hidden;
                });
                out.push('tab=' + t + ' visible=' + JSON.stringify(visible));
                /* 主题与隐藏属性实测（在今日页采集计算样式） */
                if (t === 'today') {
                  var card = document.querySelector('.view:not([hidden]) .card');
                  out.push('theme-body-bg=' + getComputedStyle(document.body).backgroundColor);
                  out.push('theme-card-bg=' + (card ? getComputedStyle(card).backgroundColor : 'no-card'));
                  out.push('theme-card-text=' + (card ? getComputedStyle(card).color : 'no-card'));
                  out.push('home-bg-display=' + (function () { var b = document.getElementById('home-bg'); return b ? getComputedStyle(b).display : 'missing'; })());
                  out.push('hidden-css-check-view-home-display=' + getComputedStyle(document.getElementById('view-home')).display + '（期望 none）');
                  out.push('tabs-bg=' + getComputedStyle(document.getElementById('tabs')).backgroundColor);
                  /* 修复2：2026-10-08 应为上班日 */
                  out.push('holiday-2026-10-08=' + (isHolidayDate('2026-10-08') ? 'HOLIDAY(错误)' : 'workday(正确)'));
                }
                if (t === 'home') {
                  /* 修复1：周次导航在首页也显示 */
                  out.push('week-nav-display-on-home=' + getComputedStyle(document.querySelector('.week-nav')).display + '（期望 block/flex）');
                }
                if (t === 'courses') {
                  /* 修复3：课表暗色 */
                  var rl = document.querySelector('.sched-grid .row-label');
                  out.push('schedule-row-label-bg=' + (rl ? getComputedStyle(rl).backgroundColor : 'no-row-label'));
                  var th = document.querySelector('.sched-grid thead th');
                  out.push('schedule-head-bg=' + (th ? getComputedStyle(th).backgroundColor : 'no-head'));
                }
                if (t === 'programming') {
                  /* 修复4：训练项目选择器 */
                  out.push('problem-pick-count=' + document.querySelectorAll('.problem-pick').length + '（期望 16）');
                }
              });
              /* 截图模式：巡检结束后停在指定页 */
              if (stopTab && all.indexOf(stopTab) !== -1) switchTab(stopTab);
              /* 按钮高亮检查 */
              var activeBtn = document.querySelector('.tab-btn.active');
              out.push('active-btn=' + (activeBtn ? activeBtn.dataset.tab : 'none'));
              /* v2 数据迁移验证 */
              try {
                out.push('version=' + state.data.version);
                var p4 = state.data.weekPlans['4'];
                out.push('week4-engineVersion=' + (p4 ? p4.engineVersion : 'missing'));
                var kept = [];
                if (p4) p4.subjects.forEach(function (sb) { sb.tasks.forEach(function (x) { if (x.status === 'done') kept.push(x.title); }); });
                out.push('week4-keptDone=' + JSON.stringify(kept));
                out.push('dailyLog-mirror-kept=' + JSON.stringify(state.data.dailyLogs['2026-09-28'] && state.data.dailyLogs['2026-09-28'].tasksStatus['legacy-1'] ? 'yes' : 'no'));
              } catch (e3) { out.push('migration-check-error=' + e3.message); }
              out.push('errors=' + JSON.stringify(window.__errors));
              writeResult('TEST-RESULT\n' + out.join('\n'));
            } catch (e2) {
              writeResult('TEST-CRASH: ' + e2.message + '\n' + (e2.stack || ''));
            }
          }, 1200);
        } catch (e1) {
          writeResult('TEST-SETUP-CRASH: ' + e1.message);
        }
      }, 500);
    });
  </script>
